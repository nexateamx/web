<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Nexa Labs</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- TOPBAR (MISMA QUE INDEX) -->
  <header class="topbar">
    <div class="container nav">
      <div class="logo">
        <span class="logo-primary">Nexa</span><span class="logo-secondary">Labs</span>
      </div>

      <div class="menu-toggle" id="menuToggle">
        <span class="material-icons-outlined">menu</span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="section error-section">
    <div class="container error-content">

      <h1 class="error-code">404</h1>

      <h2>Página no encontrada</h2>

      <p>
        La página que estás buscando no existe, fue movida
        o el enlace está mal escrito.
      </p>

      <a href="/" class="btn primary">
        Volver al inicio
      </a>

    </div>
  </main>

  <!-- FOOTER (MISMO QUE WEB) -->
  <footer class="footer">
    <div class="container footer-content">
      <p>© 2026 Nexa Labs. Desarrollo web y apps.</p>
    </div>
  </footer>

  <!-- JS -->
  <script src="js/main.js"></script>
</body>
</html>
